name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Linux tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: make test
      - run: make lint
      - run: make test-race

  build-linux:
    name: Build Linux (${{ matrix.arch }})
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build binary
        env:
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: "0"
          GOCACHE: /tmp/vimwhat-go-build
        run: |
          mkdir -p dist
          go build -trimpath -o dist/vimwhat-linux-${{ matrix.arch }} ./cmd/vimwhat
      - uses: actions/upload-artifact@v4
        with:
          name: vimwhat-linux-${{ matrix.arch }}
          path: dist/vimwhat-linux-${{ matrix.arch }}
          if-no-files-found: error

  release-linux:
    name: Publish tagged Linux release
    runs-on: ubuntu-latest
    needs: build-linux
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: vimwhat-linux-*
          merge-multiple: true
          path: dist
      - name: Publish binaries and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cd dist
          sha256sum vimwhat-linux-amd64 vimwhat-linux-arm64 > SHA256SUMS
          gh release create "$RELEASE_TAG" vimwhat-linux-amd64 vimwhat-linux-arm64 SHA256SUMS --verify-tag --generate-notes
